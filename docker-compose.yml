version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - repos_data:/app/repos
      - chroma_data:/app/chroma_db
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:///./devpilot.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  repos_data:
  chroma_data:
